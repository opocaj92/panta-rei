name: Build Panta Rei

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows executable
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name "Panta Rei" --icon "assets/icons/panta_rei.ico" --add-data "assets:assets" --add-data "data:data" main.py

      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: Panta-Rei-Windows
          path: dist/Panta Rei/

  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux executable
        run: |
          python -m PyInstaller --noconfirm --clean --name "Panta Rei" --add-data "assets:assets" --add-data "data:data" main.py

      - name: Create Linux launcher
        run: |
          cat > "dist/Panta Rei/Panta Rei.desktop" <<'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Panta Rei
          Comment=A narrative pixel-art game
          Exec=sh -c 'cd "$(dirname "$1")" && exec "./Panta Rei"' sh %k
          Icon=panta_rei
          Terminal=false
          Categories=Game;
          EOF

          mkdir -p "dist/Panta Rei/icons"
          cp assets/icons/panta_rei_512.png "dist/Panta Rei/icons/panta_rei.png"

      - name: Upload Linux build
        uses: actions/upload-artifact@v6
        with:
          name: Panta-Rei-Linux
          path: dist/Panta Rei/

  build-macos:
    name: Build macOS
    runs-on: macos-15-intel

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS application
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "Panta Rei" \
            --icon "assets/icons/panta_rei.icns" \
            --add-data "assets:assets" \
            --add-data "data:data" \
            main.py

      - name: Package macOS application
        run: |
          cd dist
          zip -r -y Panta-Rei-macOS.zip "Panta Rei.app"

      - name: Upload macOS build
        uses: actions/upload-artifact@v6
        with:
          name: Panta-Rei-macOS
          path: dist/Panta-Rei-macOS.zip

  build-android:
    name: Build Android
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Cache Android build dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: android-buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-v1
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config cmake ninja-build libffi-dev libssl-dev zlib1g-dev libncurses-dev libtinfo6
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython
      - name: Check Android package inputs
        run: |
          test -f main.py
          test -f buildozer.spec
          test -f assets/icons/panta_rei_android.png
          test -d assets
          test -d data
      - name: Build Android debug APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          buildozer -v android debug
      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: Panta-Rei-Android-APK
          path: bin/*.apk
          if-no-files-found: error
      - name: Upload Android build logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Panta-Rei-Android-Logs
          path: |
            .buildozer/android/platform/build-*/dists/*/build/outputs/logs/*
            .buildozer/android/platform/build-*/dists/*/build/reports/**
          if-no-files-found: ignore

  build-ios:
    name: Build iOS Simulator
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install pygame-ios packaging tool
        run: python -m pip install pygame-ios==0.0.5
      - name: Check iOS package inputs
        run: |
          test -f main.py
          test -f assets/icons/panta_rei_1024.png
          test -d game
          test -d assets
          test -d data
      - name: Generate iOS Xcode project
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYTHON'
          import os
          import runpy
          import sys
          from urllib.parse import urlparse

          import requests

          original_request = requests.sessions.Session.request

          def authenticated_request(self, method, url, **kwargs):
              if urlparse(url).hostname == "api.github.com":
                  headers = dict(kwargs.pop("headers", {}) or {})
                  headers.setdefault("Authorization", f"Bearer {os.environ['GH_API_TOKEN']}")
                  headers.setdefault("Accept", "application/vnd.github+json")
                  kwargs["headers"] = headers
              return original_request(self, method, url, **kwargs)

          requests.sessions.Session.request = authenticated_request
          sys.argv = ["pygame_ios", ".", "main.py", "2.5.6"]
          runpy.run_module("pygame_ios", run_name="__main__")
          PYTHON
      - name: Configure iOS icon and landscape orientation
        run: python scripts/configure_ios_project.py
      - name: Build unsigned iOS Simulator app
        run: |
          set -o pipefail
          PROJECT="$(find . -name '*.xcodeproj' -not -path './.buildozer/*' -print -quit)"
          if [ -z "$PROJECT" ]; then echo 'pygame-ios did not generate an Xcode project'; exit 1; fi
          echo "Xcode project: $PROJECT"
          xcodebuild -list -project "$PROJECT"
          SCHEME="$(xcodebuild -list -json -project "$PROJECT" | python -c 'import json,sys; p=json.load(sys.stdin)["project"]; print((p.get("schemes") or p.get("targets") or [""])[0])')"
          test -n "$SCHEME"
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/panta-ios-derived" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator application
        run: |
          set -e
          APP="$(find "$RUNNER_TEMP/panta-ios-derived/Build/Products" -name '*.app' -type d -print -quit)"
          test -n "$APP"
          mkdir -p ios-artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP" ios-artifacts/Panta-Rei-iOS-Simulator.zip
      - name: Upload iOS Simulator build
        uses: actions/upload-artifact@v6
        with:
          name: Panta-Rei-iOS-Simulator-Experimental
          path: ios-artifacts/Panta-Rei-iOS-Simulator.zip
          if-no-files-found: error
      - name: Upload generated Xcode project on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Panta-Rei-iOS-Diagnostics
          path: |
            pygame-ios-template/**
          if-no-files-found: ignore
